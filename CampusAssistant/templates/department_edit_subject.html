<!DOCTYPE html>
<html>
<head>
    <title>Department - Edit Subject</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    {% include 'department_module_nav.html' %}

    <div style="max-width:600px; margin:1rem auto 0; padding:0 1rem;">
        <a href="/department-result?department={{ department }}&semester={{ semester }}" class="btn-vv-outline">&larr; Back to Results</a>
    </div>

    <div class="main-content">
        <div class="vv-card" style="max-width:600px;">
            <div class="vv-card-header">
                <h3><i class="bi bi-pencil"></i> Edit Subject</h3>
            </div>

            <form method="POST" action="/department-result/update-subject/{{ record[0] }}" class="form-vv">
                <input type="hidden" name="department" value="{{ department }}">
                <input type="hidden" name="semester" value="{{ semester }}">
                <div>
                    <label style="display:block; margin-bottom:0.3rem; font-weight:600;">Subject Code</label>
                    <input type="text" name="subject_code" value="{{ record[3] }}" required style="padding:0.6rem; border-radius:8px; border:1px solid #ddd; width:100%;">
                </div>
                <div style="margin-top:1rem;">
                    <label style="display:block; margin-bottom:0.3rem; font-weight:600;">Subject Name</label>
                    <input type="text" name="subject_name" value="{{ record[2] }}" required style="padding:0.6rem; border-radius:8px; border:1px solid #ddd; width:100%;">
                </div>
                <button type="submit" class="btn-vv" style="background:#667eea; margin-top:1.5rem;">Update Subject</button>
            </form>
        </div>
    </div>

    <footer class="footer-vv">
        <p>Campus Assistant &copy; 2025</p>
    </footer>
</body>
</html>
