<!DOCTYPE html>
<html>
<head>
    <title>Admin - Placement</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    {% include 'department_module_nav.html' %}

    <div style="max-width:900px; margin:1rem auto 0; padding:0 1rem;">
        <a href="/department-dashboard" class="btn-vv-outline">&larr; Back to Dashboard</a>
    </div>

    <div class="main-content">
        <div class="vv-card" style="max-width:900px;">
            <div class="vv-card-header">
                <h3>Placements (Create / View / Edit / Delete)</h3>
            </div>

            <form method="POST" action="/department-placement/create" class="form-vv">
                <h4 style="margin-top:1.2rem;">Add Placement</h4>
                <input type="text" name="department" placeholder="Department" required>
                <input type="text" name="company" placeholder="Company" required>
                <input type="text" name="package" placeholder="Package" required>
                <button type="submit" class="btn-vv">Create</button>
            </form>

            <table class="table-vv" style="margin-top:1.5rem;">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Department</th>
                        <th>Company</th>
                        <th>Package</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for row in records %}
                        <tr>
                            <td>{{ row[0] }}</td>
                            <td>{{ row[1] }}</td>
                            <td>{{ row[2] }}</td>
                            <td>{{ row[3] }}</td>
                            <td>
                                <a class="btn-vv-outline" href="/department-placement/edit/{{ row[0] }}">Edit</a>
                                <a class="btn-vv-outline" href="/department-placement/delete/{{ row[0] }}" onclick="return confirm('Delete this record?')">Delete</a>
                            </td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>

        </div>
    </div>
</body>
</html>
