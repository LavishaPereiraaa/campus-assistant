<!DOCTYPE html>
<html>
{% include "header.html" %}
<body>
    {% include "nav.html" %}

    <div class="main-content">
        <div class="vv-card" style="max-width:600px;">
            <div class="vv-card-header">
                <h3>Placement Information</h3>
            </div>
            <table class="table-vv">
                <thead>
                    <tr>
                        <th>Company</th>
                        <th>Package</th>
                    </tr>
                </thead>
                <tbody>
                    {% for company, package in records %}
                        <tr><td>{{ company }}</td><td>{{ package }}</td></tr>
                    {% endfor %}
                </tbody>
            </table>
            <a href="/dashboard" class="btn-vv-outline" style="margin-top:1.5rem; text-align:center;">Back to Dashboard</a>
        </div>
    </div>

    {% include "footer.html" %}
</body>
</html>
