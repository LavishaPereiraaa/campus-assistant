<!DOCTYPE html>
<html>
<head>
    <title>Department - Edit Marks</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    {% include 'department_module_nav.html' %}

    <div style="max-width:600px; margin:1rem auto 0; padding:0 1rem;">
        <a href="/department-result?department={{ department }}&semester={{ semester }}&action=view_results&student_id={{ student_id }}" class="btn-vv-outline">&larr; Back to Results</a>
    </div>

    <div class="main-content">
        <div class="vv-card" style="max-width:600px;">
            <div class="vv-card-header">
                <h3><i class="bi bi-pencil-square"></i> Edit Marks</h3>
                <p style="margin:0.5rem 0 0; color:#666; font-size:0.9rem;">
                    Student: {{ student_name }} | Subject: {{ subject_name }}
                </p>
            </div>

            <form method="POST" action="/department-result/update-marks/{{ record[0] }}" class="form-vv">
                <input type="hidden" name="department" value="{{ department }}">
                <input type="hidden" name="semester" value="{{ semester }}">
                <input type="hidden" name="student_id" value="{{ student_id }}">
                <div>
                    <label style="display:block; margin-bottom:0.3rem; font-weight:600;">Obtained Marks</label>
                    <input type="number" name="marks" min="0" max="{{ record[6] }}" value="{{ record[5] }}" required style="padding:0.6rem; border-radius:8px; border:1px solid #ddd; width:100%; text-align:center; font-size:1.2rem;">
                </div>
                <div style="margin-top:1rem;">
                    <label style="display:block; margin-bottom:0.3rem; font-weight:600;">Max Marks</label>
                    <input type="number" name="max_marks" min="1" value="{{ record[6] }}" required style="padding:0.6rem; border-radius:8px; border:1px solid #ddd; width:100%; text-align:center; font-size:1.2rem;">
                </div>
                <button type="submit" class="btn-vv" style="background:#667eea; margin-top:1.5rem;">Update Marks</button>
            </form>
        </div>
    </div>

    <footer class="footer-vv">
        <p>Campus Assistant &copy; 2025</p>
    </footer>
</body>
</html>
