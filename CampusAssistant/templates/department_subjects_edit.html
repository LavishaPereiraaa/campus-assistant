<!DOCTYPE html>
<html>
<head>
    <title>Edit Subject</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .page-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 1.5rem 2rem; border-radius: 12px; margin-bottom: 1.5rem; }
        .page-header h2 { margin: 0 0 0.3rem; }
        .page-header p { margin: 0; opacity: 0.9; }

        .form-card { border: none; border-radius: 16px; padding: 2rem; box-shadow: 0 4px 20px rgba(0,0,0,0.08); max-width: 600px; margin: 0 auto; }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: #333; }
        .form-group input { width: 100%; padding: 0.8rem 1rem; border-radius: 8px; border: 1px solid #ddd; font-size: 1rem; }
        .form-group input:focus { outline: none; border-color: #667eea; }
        .form-actions { display: flex; gap: 1rem; justify-content: center; margin-top: 2rem; }
        .btn-save { background: #667eea !important; color: white !important; border: none !important; padding: 0.8rem 2rem !important; border-radius: 25px !important; font-size: 1rem !important; }
        .btn-save:hover { background: #5a6fd1 !important; }
    </style>
</head>
<body>
    {% include 'department_module_nav.html' %}

    <div style="max-width:1200px; margin:1rem auto 0; padding:0 1rem;">
        <a href="/department-subjects?department={{ department }}&semester={{ semester }}" class="btn-vv-outline" style="padding:0.5rem 1rem; border-radius:20px;">
            <i class="bi bi-arrow-left"></i> Back to Subjects
        </a>
    </div>

    <div class="main-content">
        <div class="vv-card" style="max-width:600px;">
            <div class="page-header">
                <h2><i class="bi bi-pencil-square"></i> Edit Subject</h2>
                <p>Update subject details</p>
            </div>

            <div class="form-card">
                <form method="POST" action="/department-subjects/edit/{{ subject[0] }}">
                    <input type="hidden" name="department" value="{{ department }}">
                    <input type="hidden" name="semester" value="{{ semester }}">
                    <div class="form-group">
                        <label>Subject Code</label>
                        <input type="text" name="subject_code" value="{{ subject[2] }}" required>
                    </div>
                    <div class="form-group">
                        <label>Subject Name</label>
                        <input type="text" name="subject_name" value="{{ subject[1] }}" required>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn-vv btn-save">
                            <i class="bi bi-save"></i> Save Changes
                        </button>
                        <a href="/department-subjects?department={{ department }}&semester={{ semester }}" class="btn-vv-outline" style="padding:0.8rem 1.5rem; border-radius:25px;">
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer class="footer-vv">
        <p>Campus Assistant &copy; 2025</p>
    </footer>
</body>
</html>
